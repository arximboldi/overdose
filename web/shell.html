<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overdose</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111214;
      --fg: #d8d6d0;
      --muted: #8a8780;
      --accent: #c9473a;
      --line: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
    }
    /* The game renders at 4:3; fit it in the window without scrolling. */
    header, footer, .screen {
      width: min(100%, 800px, calc((100dvh - 190px) * 4 / 3));
    }
    header, footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.04em; }
    h1 span { color: var(--accent); }
    button {
      background: none;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    .screen {
      position: relative;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 1px solid var(--line);
    }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      pointer-events: none;
    }
    #status:empty { display: none; }
    footer { color: var(--muted); font-size: 13px; flex-wrap: wrap; }
    kbd {
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 4px;
      font: 12px ui-monospace, monospace;
      color: var(--fg);
    }
    a { color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <h1>OVER<span>DOSE</span></h1>
    <button id="fullscreen" type="button">Fullscreen</button>
  </header>

  <div class="screen">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading…</div>
  </div>

  <footer>
    <span>
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> walk ·
      mouse turns the camera ·
      <kbd>b</kbd> buy · <kbd>space</kbd> take ·
      <kbd>n</kbd>/<kbd>m</kbd> choose drug
    </span>
    <span>Free software, <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPLv3</a></span>
  </footer>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('canvas');

    canvas.addEventListener('webglcontextlost', (event) => {
      status.textContent = 'The WebGL context was lost. Reload the page to play again.';
      event.preventDefault();
    });

    document.getElementById('fullscreen').addEventListener('click', () => {
      Module.requestFullscreen(false, false);
    });

    var Module = {
      canvas,
      // Command line options for the game, e.g. ?args=-i%20tester
      arguments: (new URLSearchParams(location.search).get('args') || '')
        .split(' ').filter(Boolean),
      preRun: [() => {
        // Emscripten's SDL_ttf draws text with the browser and uses the
        // path the game opened the font from as the CSS font family.
        // Register the game's font under that name before it starts.
        Module.addRunDependency('font');
        new FontFace('/data/font/DejaVuSans.ttf', 'url(DejaVuSans.ttf)')
          .load()
          .then((font) => document.fonts.add(font))
          .catch((error) => console.warn('Could not load the game font:', error))
          .finally(() => Module.removeRunDependency('font'));
      }],
      setStatus: (text) => {
        status.textContent = text.replace(/\(\d+\/\d+\)/, '').trim();
      },
      onRuntimeInitialized: () => {
        status.textContent = '';
        canvas.focus();
      },
    };

    window.onerror = () => {
      status.textContent = 'Something went wrong. See the browser console for details.';
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
